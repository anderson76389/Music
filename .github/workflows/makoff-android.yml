name: MAKOFF Music Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Independence audit
        run: python3 scripts/audit_independence.py
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug :app:testFossDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-test-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
