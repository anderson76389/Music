name: Metrolist Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Independence audit
        run: |
          python3 scripts/audit_independence.py
          python3 scripts/audit_settings.py
      - name: Create test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Metrolist Test,O=MAKOFF,C=FR"
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug :app:assembleGmsDebug :app:testFossDebugUnitTest :app:assembleGmsDebugAndroidTest :innertubex:desktopTest :innertubex:apiCheck
      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-test-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-Google-Cast-test-APK
          path: app/build/outputs/apk/gms/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-instrumentation-APK
          path: app/build/outputs/apk/androidTest/gms/debug/*.apk
          if-no-files-found: error

  apk-smoke:
    name: Installation et démarrage des deux APK
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-test-APK
          path: apk-foss
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-Google-Cast-test-APK
          path: apk-gms
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-instrumentation-APK
          path: apk-tests
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et ouvrir les APK sur Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke_apk.sh
      - name: Conserver les preuves et journaux de démarrage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-tests-demarrage
          path: smoke-results/
          if-no-files-found: warn

  publish-test:
    name: Publier l’APK universel vérifié dans Releases
    needs: [android, apk-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-Google-Cast-test-APK
          path: apk-gms
      - name: Préparer les APK, les sources et les sommes de contrôle
        run: |
          mkdir -p dist
          cp apk-gms/*.apk dist/Metrolist.apk
          git archive --format=zip --output=dist/MAKOFF-Music-source.zip HEAD
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publier une préversion après les contrôles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cat > notes.txt <<'NOTES'
          ## APK de test Metrolist

          - **Metrolist.apk** : un seul APK universel, avec Google Cast.
          - Sources et sommes de contrôle SHA-256 jointes.

          Compilation des deux variantes, tests unitaires, tests du moteur et installation/démarrage des deux APK sur émulateur Android 11 réussis. La lecture YouTube réelle, la connexion, les téléchargements et la diffusion Cast restent à vérifier sur téléphone. Ces essais ne sont pas garantis par le contrôle de démarrage.

          Android 8.0 minimum. Identifiant de test : fr.makoff.music.debug. Signature temporaire : la mise à jour directe entre deux préversions n'est pas garantie. Sauvegardez vos données avant de remplacer une installation. Mises à jour automatiques désactivées pour ces APK de test.
          NOTES
          cat CHANGEMENTS-VERSION.txt >> notes.txt
          printf '\nSources : `%s`\nVérifications : %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Metrolist — test ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" --prerelease --latest=false --notes-file notes.txt dist/*
          fi
