name: MAKOFF Music Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Independence audit
        run: python3 scripts/audit_independence.py
      - name: Create test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MAKOFF Music Test,O=MAKOFF,C=FR"
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug :app:assembleGmsDebug :app:testFossDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-test-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-Google-Cast-test-APK
          path: app/build/outputs/apk/gms/debug/*.apk
          if-no-files-found: error

  listening-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/listen-together
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/listen-together/go.mod
          cache-dependency-path: services/listen-together/go.sum
      - name: Install protocol compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Build and test independent listening server
        run: |
          bash scripts/generate_proto.sh
          go test ./...
          go build -o /tmp/makoff-listening-server ./cmd/metroserver
