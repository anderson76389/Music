name: Music Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Independence audit
        run: |
          python3 scripts/audit_independence.py
          python3 scripts/audit_settings.py
          python3 scripts/test_release_version.py
      - name: Create test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Music Test,O=MAKOFF,C=FR"
      - name: Build and test
        run: |
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/music-queue-probe"
          javac -cp "$ANDROID_HOME/platforms/android-37.0/android.jar" -d "$RUNNER_TEMP/music-queue-probe" scripts/compat/QueueFormatProbe.java
          ./gradlew :innertubex:desktopApiDump
          ./gradlew :app:assembleFossDebug :app:assembleGmsDebug :app:testFossDebugUnitTest :app:assembleGmsDebugAndroidTest :innertubex:desktopTest :innertubex:apiCheck
      - name: Conserver l’interface générée du moteur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Music-generated-engine-api
          path: vendor/innertubex/api/desktop/innertubex.api
          if-no-files-found: error
      - name: Vérifier que l’interface générée est enregistrée
        run: git diff --exit-code -- vendor/innertubex/api
      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-test-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-Google-Cast-test-APK
          path: app/build/outputs/apk/gms/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-Music-instrumentation-APK
          path: app/build/outputs/apk/androidTest/gms/debug/*.apk
          if-no-files-found: error

  apk-smoke:
    name: Installation et démarrage Android ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-test-APK
          path: apk-foss
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-Google-Cast-test-APK
          path: apk-gms
      - uses: actions/download-artifact@v4
        with:
          name: MAKOFF-Music-instrumentation-APK
          path: apk-tests
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et ouvrir les APK sur Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -feature -Vulkan
          script: bash scripts/smoke_apk.sh
      - name: Conserver les preuves et journaux de démarrage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-tests-demarrage-${{ matrix.api }}
          path: smoke-results/
          if-no-files-found: warn
