name: Publier les APK stables signés
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag correspondant à la version du code, par exemple v13.7.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Restore private publication key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Configure the four MUSIC signing secrets before publishing."; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Audit, test and build both variants
        env:
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([^"]+)"', Path('app/build.gradle.kts').read_text())[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match versionName'
          PYCODE
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Metrolist Test,O=MAKOFF,C=FR"
          python3 scripts/audit_independence.py
          chmod +x gradlew
          ./gradlew :app:testFossDebugUnitTest :app:assembleFossRelease :app:assembleGmsRelease
          mkdir -p dist
          cp app/build/outputs/apk/gms/release/app-gms-release.apk dist/MAKOFF-Music-universal.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Préparer les APK stables pour les essais
        run: |
          mkdir -p apk-foss apk-gms
          cp app/build/outputs/apk/foss/release/app-foss-release.apk apk-foss/
          cp dist/MAKOFF-Music-universal.apk apk-gms/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vérifier les deux APK stables sur Android 11
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_PACKAGE: fr.makoff.music
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke_apk.sh
      - name: Conserver les preuves des essais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-tests-stables
          path: smoke-results/
          if-no-files-found: warn
      - name: Publish own APKs and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git archive --format=zip --output=dist/MAKOFF-Music-source.zip HEAD
          cat > notes.txt <<'NOTES'
          ## Metrolist pour Android

          - **MAKOFF-Music-universal.apk** : un seul APK universel, avec Google Cast.
          - Sources et sommes de contrôle des APK jointes.

          APK signés avec la clé privée du projet. Tests unitaires et contrôle d'installation/démarrage des deux APK sur émulateur Android 11 réussis. Android 8.0 minimum. Les essais de lecture réelle, de connexion et de diffusion sur appareils restent distincts de ce contrôle automatisé.
          NOTES
          cat CHANGEMENTS-VERSION.txt >> notes.txt
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Metrolist $RELEASE_TAG" --notes-file notes.txt dist/*
      - name: Delete private key
        if: always()
        run: rm -f app/keystore/release.keystore
