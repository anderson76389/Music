name: Publish signed Music APKs
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the source version, for example v13.7.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Restore private publication key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Configure the four MUSIC signing secrets before publishing."; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Audit, test and build both variants
        env:
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([^"]+)"', Path('app/build.gradle.kts').read_text())[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match versionName'
          PYCODE
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MAKOFF Music Test,O=MAKOFF,C=FR"
          python3 scripts/audit_independence.py
          chmod +x gradlew
          ./gradlew :app:testFossDebugUnitTest :app:assembleFossRelease :app:assembleGmsRelease
          mkdir -p dist
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/MAKOFF-Music.apk
          cp app/build/outputs/apk/gms/release/app-gms-release.apk dist/MAKOFF-Music-Google-Cast.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish own APKs and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git archive --format=zip --output=dist/MAKOFF-Music-source.zip HEAD
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "MAKOFF Music $RELEASE_TAG" --generate-notes dist/*
      - name: Delete private key
        if: always()
        run: rm -f app/keystore/release.keystore
