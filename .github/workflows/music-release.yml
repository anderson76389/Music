name: Publier les APK stables signés
on:
  workflow_run:
    workflows: ["Music Android"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: music-signed-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Lire l’APK publié et attribuer une version supérieure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-apk
          # Fetch exactly ONE previous universal APK. Downloading all future
          # per-ABI assets would waste hundreds of MB on each release build.
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Apple.Music.apk' --dir previous-apk; then
            previous_apk=previous-apk/Apple.Music.apk
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Metrolist.apk' --dir previous-apk
            previous_apk=previous-apk/Metrolist.apk
          fi
          test -f "$previous_apk"
          echo "PREVIOUS_APK=$previous_apk" >> "$GITHUB_ENV"
          python3 scripts/release_version.py --run-number "$GITHUB_RUN_NUMBER" --previous-apk "$previous_apk" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt2" --github-env "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Restore private publication key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Configure the four MUSIC signing secrets before publishing."; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Audit, test and build both variants
        env:
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Music Test,O=MAKOFF,C=FR"
          python3 scripts/audit_independence.py
          python3 scripts/audit_player_regressions.py
          python3 scripts/test_release_notes.py
          chmod +x gradlew
          ./gradlew :app:testFossDebugUnitTest :app:assembleFossRelease :app:assembleGmsRelease
          mkdir -p dist
          cp app/build/outputs/apk/gms/release/app-gms-release.apk dist/Apple.Music.apk
          # Older installed versions only recognize Metrolist.apk in Releases.
          # Both downloads contain the identical signed APK; do not change the app ID.
          cp dist/Apple.Music.apk dist/Metrolist.apk
          cmp dist/Apple.Music.apk dist/Metrolist.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Apple.Music.apk > dist/SIGNATURE.txt
      - name: Préparer les APK compacts par architecture
        env:
          STORE_PASSWORD: ${{ secrets.MUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          # The universal release is already stored in dist. Reconfigure AGP
          # solely for this second signed build; no debug or legacy output changes.
          MUSIC_ABI_SPLITS=true ./gradlew :app:assembleGmsRelease
          python3 scripts/collect_abi_apks.py app/build/outputs/apk/gms/release dist --universal dist/Apple.Music.apk
          for apk in dist/Apple.Music-*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > /dev/null
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > /tmp/music-abi-badging.txt
            grep -q "package: name='fr.makoff.music'" /tmp/music-abi-badging.txt
          done
      - name: Préparer les APK stables pour les essais
        run: |
          mkdir -p apk-foss apk-gms
          cp app/build/outputs/apk/foss/release/app-foss-release.apk apk-foss/
          # Exercise the slim x86_64 APK on the actual smoke emulator.
          cp dist/Apple.Music-x86_64.apk apk-gms/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vérifier les deux APK stables sur Android 11
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_PACKAGE: fr.makoff.music
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke_apk.sh && bash scripts/check_apk_upgrade.sh
      - name: Conserver les preuves des essais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAKOFF-tests-stables
          path: smoke-results/
          if-no-files-found: warn
      - name: Publish own APKs and source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --output=dist/MAKOFF-Music-source.zip HEAD
          printf 'MUSIC_VERSION_CODE=%s\nMUSIC_VERSION_NAME=%s\nSOURCE_SHA=%s\n' "$MUSIC_VERSION_CODE" "$MUSIC_VERSION_NAME" "$SOURCE_SHA" > dist/BUILD.txt
          (cd dist && sha256sum Apple.Music.apk Apple.Music-*.apk Metrolist.apk MAKOFF-Music-source.zip SIGNATURE.txt BUILD.txt > SHA256SUMS.txt)
          # Compare the last INSTALLED RELEASE's source commit with this exact
          # signed APK. Never show accumulated or hand-written old changelogs.
          mkdir -p previous-apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'BUILD.txt' --dir previous-apk --clobber
          previous_sha="$(sed -n 's/^SOURCE_SHA=//p' previous-apk/BUILD.txt | head -n 1)"
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Previous published source SHA missing"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/compare/${previous_sha}...${SOURCE_SHA}" > release-comparison.json
          python3 scripts/render_release_notes.py release-comparison.json NOTES-VERSION.txt
          cp NOTES-VERSION.txt notes.txt
          cat >> notes.txt <<'NOTES'
          ## Apple Music pour Android

          - **Apple.Music-arm64-v8a.apk** : APK allégé recommandé pour les téléphones Android modernes 64 bits, dont HONOR Magic V6.
          - **Apple.Music-armeabi-v7a.apk**, **Apple.Music-x86.apk**, **Apple.Music-x86_64.apk** : APK allégés selon l'architecture de l'appareil.
          - **Apple.Music.apk** : APK universel pour les appareils et anciennes versions qui ne sélectionnent pas encore les APK allégés.
          - **Metrolist.apk** : copie identique de l'APK universel pour préserver les mises à jour des anciennes versions.
          - Toutes les variantes ont le même identifiant Android et la même clé de signature ; la mise à jour remplace l'installation existante.
          - Les APK par architecture sont vérifiés comme réellement plus petits que l'APK universel, et inclus aux sommes de contrôle SHA-256.

          APK signés avec la clé privée du projet. Tests unitaires, installation/démarrage des deux APK et remplacement de l’APK précédent sur émulateur Android 11 réussis. Android 8.0 minimum. Les essais de lecture réelle, de connexion et de diffusion sur appareils restent distincts de ce contrôle automatisé.
          NOTES
          # Only changes made since the previous published APK are displayed.
          printf '\nSources : `%s`\n' "$SOURCE_SHA" >> notes.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" --title "Apple Music $RELEASE_TAG" --notes-file notes.txt
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file notes.txt
      - name: Delete private key
        if: always()
        run: rm -f app/keystore/release.keystore
